        <style>
        *, *::before, *::after{
            box-sizing: border-box;
        }

        body{
            margin: 0;
            color: rgb(250, 105, 0);
            font-family: 'Rancho', cursive;
            font-size: 14px;
            line-height: 1.42857;
        }

        h1, h2{
            font-weight: 500;
            line-height: 1.1;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        h2{
            font-size: 30px;
            text-align: center;
        }

        img{
            display:block;
            margin-left: auto;
            margin-right: auto;
        }

        a{
            color: rgb(250, 105, 0);
            text-decoration: none;
        }

        a:hover{
            color: rgb(105, 210, 231);
        }

        .container{
            max-width: 1170px;
            margin: 0 auto;
            padding: 0 15px;
        }

        #page-title{
            margin-top: 125px;
            text-align:center;
            margin-bottom:30px;
            font-size: 3em;
        }

        .nav-row{
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .nav-row:first-of-type{
            margin-top: 40px;
        }

        .nav-row > a{
            width: 33.3333%;
        }

        @media (max-width: 500px){
            .nav-row{
                flex-direction: column;
                align-items: center;
                margin-top: 0;
            }

            .nav-row > a{
                width: auto;
            }
        }

        /* English label swaps to its Korean counterpart on hover/focus (desktop) or first tap (touch) */
        .nav-row h2{
            display: grid;
            justify-items: center;
        }

        .nav-row h2 > span{
            grid-area: 1 / 1;
            transition: opacity 0.2s;
        }

        .nav-row .ko{
            font-family: 'Nanum Pen Script', cursive;
            font-size: 1.15em;
            opacity: 0;
        }

        .nav-row > a:focus-visible .en,
        .nav-row > a.show-ko .en{
            opacity: 0;
        }

        .nav-row > a:focus-visible .ko,
        .nav-row > a.show-ko .ko{
            opacity: 1;
        }

        @media (hover: hover){
            .nav-row > a:hover .en{
                opacity: 0;
            }

            .nav-row > a:hover .ko{
                opacity: 1;
            }
        }

        .social{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-top: 100px;
        }
        </style>

    <script>
    // Touch screens have no hover: a tap shows the Korean word briefly, then follows the link.
    (function(){
        if (!window.matchMedia('(hover: none)').matches) return;
        var links = document.querySelectorAll('.nav-row > a');
        links.forEach(function(link){
            link.addEventListener('click', function(e){
                e.preventDefault();
                link.classList.add('show-ko');
                setTimeout(function(){ window.location.href = link.href; }, 400);
            });
        });
        window.addEventListener('pageshow', function(){
            links.forEach(function(l){ l.classList.remove('show-ko'); });
        });
    })();
    </script>
